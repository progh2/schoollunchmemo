name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Qt는 offscreen으로 돌려도 EGL과 글꼴이 필요하다
      - name: 리눅스 Qt 실행 라이브러리 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 fonts-dejavu-core

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 테스트
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
