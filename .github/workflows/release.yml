name: Release

on:
  push:
    tags: ["v*"]
  # 태그 없이도 빌드만 테스트할 수 있게 한다 (릴리스는 만들지 않는다)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }} 빌드
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: schoolnote-windows
          - os: macos-latest
            name: macOS
            artifact: schoolnote-macos
          - os: ubuntu-latest
            name: Linux
            artifact: schoolnote-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 리눅스 Qt 실행 라이브러리 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 fonts-dejavu-core

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 테스트
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: 실행 파일 빌드
        run: pyinstaller schoolnote.spec --noconfirm

      - name: 산출물 압축 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/SchoolNote/SchoolNote.exe"
          if (-not (Test-Path $exe)) { throw "빌드 산출물이 없습니다: $exe" }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $asset = "SchoolNote-$version-windows-x64.zip"
          Compress-Archive -Path "dist/SchoolNote/*" -DestinationPath $asset -Force
          Write-Output ("압축: {0} ({1:N1} MB)" -f $asset, (Get-Item $asset).Length / 1MB)
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 산출물 압축 (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -d "dist/SchoolNote.app" ]; then echo "빌드 산출물이 없습니다" && exit 1; fi
          version=$([ "$GITHUB_REF_TYPE" = "tag" ] && echo "$GITHUB_REF_NAME" || echo "dev")
          asset="SchoolNote-${version}-macos.zip"
          cd dist && zip -r "../${asset}" SchoolNote.app
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: 산출물 압축 (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -d "dist/SchoolNote" ]; then echo "빌드 산출물이 없습니다" && exit 1; fi
          version=$([ "$GITHUB_REF_TYPE" = "tag" ] && echo "$GITHUB_REF_NAME" || echo "dev")
          asset="SchoolNote-${version}-linux-x64.tar.gz"
          tar -czf "$asset" -C dist SchoolNote
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ASSET }}
          retention-days: 14

  release:
    name: 릴리스 등록
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: schoolnote-*
          merge-multiple: true

      - name: 릴리스 생성 및 파일 업로드
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            SchoolNote-*.zip \
            SchoolNote-*.tar.gz \
            --title "학교쪽지 ${{ github.ref_name }}" \
            --generate-notes
