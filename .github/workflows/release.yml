name: Release

on:
  push:
    tags: ["v*"]
  # 태그 없이도 빌드만 테스트할 수 있게 한다 (릴리스는 만들지 않는다)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }} 빌드
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: schoolnote-windows
          - os: macos-latest
            name: macOS
            artifact: schoolnote-macos
          - os: ubuntu-latest
            name: Linux
            artifact: schoolnote-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 리눅스 Qt 실행 라이브러리 설치
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 fonts-dejavu-core

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 테스트
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: 실행 파일 빌드
        run: pyinstaller schoolnote.spec --noconfirm

      # 받자마자 꺼지는 빌드(숨은 import 누락 등)를 릴리스 전에 잡는다.
      # 10초 뒤에도 살아 있으면 정상으로 본다.
      - name: 실행 확인 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/SchoolNote.exe"
          if (-not (Test-Path $exe)) { throw "빌드 산출물이 없습니다: $exe" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "실행 직후 종료됐습니다 (코드 $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Output "10초 동안 정상 실행"

      - name: 실행 확인 (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            bin="dist/SchoolNote.app/Contents/MacOS/SchoolNote"
          else
            bin="dist/SchoolNote"
          fi
          if [ ! -x "$bin" ]; then echo "빌드 산출물이 없습니다: $bin" && exit 1; fi
          QT_QPA_PLATFORM=offscreen "$bin" &
          pid=$!
          sleep 10
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            echo "10초 동안 정상 실행"
          else
            wait "$pid"; code=$?
            echo "실행 직후 종료됐습니다 (코드 $code)" && exit 1
          fi

      # 산출물 이름의 windows / macos / linux 와 확장자는 updater.py가
      # 플랫폼 파일을 고르는 기준이다. 바꾸면 자동 업데이트가 끊긴다.
      - name: 산출물 준비 (Windows — .exe 하나)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          $asset = "SchoolNote-$version-windows-x64.exe"
          Copy-Item "dist/SchoolNote.exe" $asset
          Write-Output ("준비: {0} ({1:N1} MB)" -f $asset, ((Get-Item $asset).Length / 1MB))
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 산출물 준비 (macOS — .dmg)
        if: runner.os == 'macOS'
        run: |
          version=$([ "$GITHUB_REF_TYPE" = "tag" ] && echo "$GITHUB_REF_NAME" || echo "dev")
          asset="SchoolNote-${version}-macos.dmg"
          # 열었을 때 앱 옆에 Applications 바로가기가 보여 끌어다 놓기만 하면 된다
          mkdir dmg-root
          ditto dist/SchoolNote.app dmg-root/SchoolNote.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "급식쪽지" -srcfolder dmg-root -ov -format UDZO "$asset"
          echo "준비: $asset ($(du -h "$asset" | cut -f1))"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: 산출물 준비 (Linux — 실행 파일 하나)
        if: runner.os == 'Linux'
        run: |
          version=$([ "$GITHUB_REF_TYPE" = "tag" ] && echo "$GITHUB_REF_NAME" || echo "dev")
          asset="SchoolNote-${version}-linux-x64"
          cp dist/SchoolNote "$asset"
          chmod +x "$asset"
          echo "준비: $asset ($(du -h "$asset" | cut -f1))"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ASSET }}
          retention-days: 14

  release:
    name: 릴리스 등록
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: schoolnote-*
          merge-multiple: true

      - name: 릴리스 생성 및 파일 업로드
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            SchoolNote-*-windows-x64.exe \
            SchoolNote-*-macos.dmg \
            SchoolNote-*-linux-x64 \
            --title "급식쪽지 ${{ github.ref_name }}" \
            --generate-notes
